<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Miasta i herby Sporek</title>
  <style>
    h1 {
      font-family: Arial, sans-serif;
      font-weight: bold;
    }
    table {
      border-collapse: separate;
      border-spacing: 2px;
      border: 1px solid gray;
    }
    td {
      border: 1px solid gray;
      font-family: "Times New Roman", serif;
      font-size: 13px;
      padding: 2px;
    }
    td:first-child {
      width: 100px;
    }
    td img {
      display: block;
      width: 150px;
    }
  </style>
</head>
<body>

  <h1>Miasta i herby</h1>

  <table>
    <tr>
      <td>Kraków</td>
      <td><img src="krakow.jpg" alt="Herb Krakowa"></td>
    </tr>
    <tr>
      <td>Katowice</td>
      <td><img src="katowice.png" alt="Herb Katowic"></td>
    </tr>
    <tr>
      <td>Ruda Śląska</td>
      <td><img src="rudaslaska.png" alt="Herb Rudy Śląskiej"></td>
    </tr>
    <tr>
      <td>Sosonowiec</td>
      <td><img src="sosnowiec.png" alt="Herb Sosnowca"></td>
    </tr>
  </table>

</body>
</html>

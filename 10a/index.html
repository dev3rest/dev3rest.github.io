<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Tabele Sporek</title>
    <style>
    body {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 40px;
      color: black;
    }

    table {
      border-collapse: collapse;
      table-layout: fixed;
      width: 500px;
      margin: 30px;
    }

    th, td {
      vertical-align: middle;
      text-align: center;
      border: 1px solid #555;
      width: 10px;
      height: 60px;
    }
    .kolor1 {
      background-color: #eaf2dd;
    }

    .kolor2 {
      background-color: #d7e3bd;
    }

    .kolor3 {
      background-color: #c2d69b;
    }
    .kolor4 {
      background-color: rgb(251, 148, 148);
    }
    th {
        height: 40px;
      background: #c9e9f8;
      font-weight: 400;
    }

    th:first-child {
      width: 2px;
    }


    </style>
  </head>
  <body>
    <table>
      <tr>
	<th>1</th> <th>2</th> <th>3</th> <th>4</th> <th>5</th> <th>6</th>
      </tr>
      <tr>
	<th>2</th> <td>a</td> <td class="kolor1">b</td ><td class="kolor1">c</td> <td>d</td> <td>e</td>
      </tr>
      <tr>
	<th>3</th> <td>f</td> <td>g</td> <td>h</td> <td>i</td> <td class="kolor2">j</td>
      </tr>
      <tr>
	<th>4</th> <td>k</td> <td>l</td> <td>m</td> <td>n</td> <td class="kolor2">o</td>
      </tr>
      <tr>
	<th>5</th> <td class="kolor3">p</td> <td class="kolor3">q</td> <td class="kolor3">r</td> <td>s</td> <td>t</td>
      </tr>
      <tr>
	<th>6</th> <td class="kolor3">u</td> <td class="kolor3">v</td> <td class="kolor3">w</td> <td>y</td> <td>z</td>
      </tr>
    </table> 

    <table>
      <tr>
	<th>1</th> <th>2</th> <th>3</th> <th>4</th> <th>5</th> <th>6</th>
      </tr>
      <tr>
	<th>2</th> <td>a</td> <td colspan="2" class="kolor1">b, c</td> <td>d</td> <td>e</td>
      </tr>
      <tr>
	<th>3</th> <td>f</td> <td>g</td> <td>h</td> <td>i</td> <td rowspan="2" class="kolor2">j, o</td>
      </tr>
      <tr>
	<th>4</th> <td>k</td> <td>l</td> <td>m</td> <td>n</td>
      </tr>
      <tr>
	<th>5</th> <td colspan="3" rowspan="2" class="kolor3">p, q, r, u, v, w</td> <td>s</td> <td>t</td>
      </tr>
      <tr>
	<th>6</th> <td>y</td> <td>z</td>
      </tr>
    </table>

    <table>
      <tr>
	<th>1</th> <th>2</th> <th>3</th> <th>4</th> <th>5</th> <th>6</th>
      </tr>
      <tr>
	<th>2</th> <td>a</td> <td class="kolor1">b</td ><td class="kolor1">c</td> <td>d</td> <td>e</td>
      </tr>
      <tr>
	<th>3</th> <td colspan="4" rowspan="3" class="kolor4">f, s</td> <td class="kolor2">j</td>
      </tr>
      <tr>
	<th>4</th> <td class="kolor2">o</td>
      </tr>
      <tr>
	<th>5</th> <td>t</td>
      </tr>
      <tr>
	<th>6</th> <td class="kolor3">u</td> <td class="kolor3">v</td> <td class="kolor3">w</td> <td>y</td> <td>z</td>
      </tr>
    </table> 
  </body>
</html>
